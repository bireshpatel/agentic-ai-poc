# Playwright E2E (playwright-bdd) — headless in CI; artifacts on failure.
# Manual run: Actions → Playwright → Run workflow (optional base URL).
# For push/PR: set secret PW_BASE_URL to override the default public demo URL.
name: Playwright

on:
  workflow_dispatch:
    inputs:
      pw_base_url:
        description: Playwright base URL (PW_BASE_URL)
        required: false
        default: 'https://automationexercise.com'
        type: string
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: playwright-project

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: playwright-project/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run BDD + tests
        run: npm test
        env:
          CI: true
          PW_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pw_base_url || (secrets.PW_BASE_URL != '' && secrets.PW_BASE_URL || 'https://automationexercise.com') }}
          PW_TEST_EMAIL: ${{ secrets.PW_TEST_EMAIL }}
          PW_TEST_PASSWORD: ${{ secrets.PW_TEST_PASSWORD }}

      - name: Upload test results (screenshots, traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: playwright-project/test-results
          retention-days: 7

      - name: Upload Allure raw results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: playwright-project/allure-results
          retention-days: 7

      # Published to GitHub Pages by the deploy-pages job below (push to main/master only).
      - name: Generate Allure report
        if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        run: npx allure generate allure-results --clean -o allure-report

      - name: Assemble Pages site
        if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        run: |
          mkdir -p _site
          cp -r playwright-report _site/playwright-report
          cp -r allure-report _site/allure-report
          cat > _site/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <title>Playwright Test Reports</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
              li { margin: 0.5rem 0; }
            </style>
          </head>
          <body>
            <h1>Test Reports</h1>
            <p>Latest run on <code>${GITHUB_REF_NAME}</code> — commit <code>${GITHUB_SHA:0:7}</code></p>
            <ul>
              <li><a href="./playwright-report/">Playwright HTML Report</a> (results, screenshots, traces)</li>
              <li><a href="./allure-report/">Allure Report</a> (suite breakdown, history, trends)</li>
            </ul>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-project/_site

  deploy-pages:
    needs: test
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

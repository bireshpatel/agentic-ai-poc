[project]
name = "llm-qa-toolkit"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.28.0",
    "openai>=2.14.0",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.1",
    "pydantic>=2.12.5",
    "tenacity>=9.1.2",
    "google-generativeai>=0.8.6",
    "ollama>=0.6.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

<svg viewBox="0 0 1320 810" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pipeline diagram: requirement and log files feed a provider-agnostic LLM client, which produces three draft artifacts — generated test cases, log analysis, and scaffolded Playwright-BDD files. All three are dashed, marked unreviewed, and funnel into a Human Review Gate. Only after that gate do solid, trusted boxes follow: the Playwright BDD suite, test execution, generated reports, and publication to GitHub Pages. Titled llm-qa-toolkit — LLM-assisted QA for test cases, log triage and BDD scaffolding, always human-reviewed. Tagline: not an autonomous agent — deliberate, single-shot LLM calls, always reviewed by a human before anything becomes a test.">
  <defs>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f7a68" />
    </marker>
    <marker id="arrowInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#aab2bd" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b5690f" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1320" height="810" rx="6" fill="#ffffff" stroke="#d7dce2"/>

  <!-- ===== Header ===== -->
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="48" y="56" font-size="32" font-weight="800" fill="#161b22">llm-qa-toolkit</text>
    <text x="48" y="86" font-size="15" font-family="Georgia, serif" fill="#5b6472">LLM-assisted QA — test cases, log triage &amp; BDD scaffolding, always human-reviewed</text>
    <text x="1272" y="46" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8992a0" text-anchor="end">github.com/bireshpatel/llm-qa-toolkit</text>
  </g>
  <line x1="48" y1="102" x2="1272" y2="102" stroke="#d7dce2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#161b22" transform="translate(0,104)">

    <!-- legend -->
    <g transform="translate(940,30)">
      <line x1="0" y1="4" x2="22" y2="4" stroke="#0f7a68" stroke-width="1.6" stroke-dasharray="4 3"/>
      <text x="28" y="8" font-size="10.5" fill="#8992a0">AI draft — unreviewed</text>
      <line x1="0" y1="22" x2="22" y2="22" stroke="#aab2bd" stroke-width="1.6"/>
      <text x="28" y="26" font-size="10.5" fill="#8992a0">Human-approved — executable</text>
    </g>

    <!-- ===== Row 1: inputs ===== -->
    <g>
      <rect x="40" y="117" width="190" height="70" rx="3" fill="#e4e8ec" stroke="#aab2bd"/>
      <text x="56" y="140" font-size="10" fill="#8992a0">INPUT</text>
      <text x="56" y="159" font-size="13" font-weight="700">requirements/*.md</text>
      <text x="56" y="175" font-size="11" fill="#5b6472" font-family="Georgia, serif">user stories + AC</text>
    </g>
    <g>
      <rect x="40" y="237" width="190" height="70" rx="3" fill="#e4e8ec" stroke="#aab2bd"/>
      <text x="56" y="260" font-size="10" fill="#8992a0">INPUT</text>
      <text x="56" y="279" font-size="13" font-weight="700">logs/*.log</text>
      <text x="56" y="295" font-size="11" fill="#5b6472" font-family="Georgia, serif">raw application logs</text>
    </g>

    <!-- arrows into LLM client -->
    <path d="M230,152 L260,152 L260,187 L282,187" stroke="#aab2bd" stroke-width="1.4" fill="none" marker-end="url(#arrowInk)"/>
    <path d="M230,272 L260,272 L260,237 L282,237" stroke="#aab2bd" stroke-width="1.4" fill="none" marker-end="url(#arrowInk)"/>

    <!-- ===== LLM Client ===== -->
    <rect x="285" y="132" width="220" height="220" rx="3" fill="#ffffff" stroke="#aab2bd" stroke-width="1.4"/>
    <text x="301" y="157" font-size="10" fill="#8992a0">CORE</text>
    <text x="301" y="178" font-size="14" font-weight="700">LLM Client</text>
    <text x="301" y="198" font-size="11.5" fill="#5b6472" font-family="Georgia, serif">provider-agnostic</text>
    <line x1="301" y1="210" x2="489" y2="210" stroke="#ccd3db"/>
    <text x="301" y="229" font-size="11" fill="#5b6472" font-family="Georgia, serif">OpenAI · Gemini · Ollama</text>
    <text x="301" y="247" font-size="11" fill="#5b6472" font-family="Georgia, serif">swap via .env, no code change</text>
    <text x="301" y="272" font-size="11" fill="#5b6472" font-family="Georgia, serif">retries on 429 / 5xx</text>
    <text x="301" y="290" font-size="11" fill="#5b6472" font-family="Georgia, serif">tokens + $ cost logged per call</text>
    <text x="301" y="312" font-size="9.5" fill="#8992a0">llm_client.py · cost_tracker.py</text>

    <!-- arrow client -> 3 drafts -->
    <path d="M505,172 L530,172 L530,117 L558,117" stroke="#0f7a68" stroke-width="1.4" fill="none" marker-end="url(#arrowTeal)"/>
    <path d="M505,242 L530,242 L530,232 L558,232" stroke="#0f7a68" stroke-width="1.4" fill="none" marker-end="url(#arrowTeal)"/>
    <path d="M505,312 L530,312 L530,347 L558,347" stroke="#0f7a68" stroke-width="1.4" fill="none" marker-end="url(#arrowTeal)"/>

    <!-- ===== Draft outputs (dashed = unreviewed) ===== -->
    <g>
      <rect x="560" y="77" width="240" height="80" rx="3" fill="#e3f1ee" stroke="#0f7a68" stroke-dasharray="5 3"/>
      <text x="576" y="100" font-size="10" fill="#0f7a68">testcase_generator</text>
      <text x="576" y="119" font-size="13" font-weight="700">Test cases</text>
      <text x="576" y="135" font-size="11" fill="#5b6472" font-family="Georgia, serif">draft CSV + JSON</text>
    </g>
    <g>
      <rect x="560" y="192" width="240" height="80" rx="3" fill="#e3f1ee" stroke="#0f7a68" stroke-dasharray="5 3"/>
      <text x="576" y="215" font-size="10" fill="#0f7a68">log_analyzer</text>
      <text x="576" y="234" font-size="13" font-weight="700">Log analysis</text>
      <text x="576" y="250" font-size="11" fill="#5b6472" font-family="Georgia, serif">summary + severity + exec blurb</text>
    </g>
    <g>
      <rect x="560" y="307" width="240" height="80" rx="3" fill="#e3f1ee" stroke="#0f7a68" stroke-dasharray="5 3"/>
      <text x="576" y="330" font-size="10" fill="#0f7a68">playwright_generator</text>
      <text x="576" y="349" font-size="13" font-weight="700">Scaffolded BDD</text>
      <text x="576" y="365" font-size="11" fill="#5b6472" font-family="Georgia, serif">draft .feature + step stubs + page object</text>
    </g>

    <!-- arrows drafts -> gate -->
    <path d="M800,117 L825,117 L825,217 L845,217" stroke="#b5690f" stroke-width="1.4" fill="none" marker-end="url(#arrowAmber)"/>
    <path d="M800,232 L845,232" stroke="#b5690f" stroke-width="1.4" fill="none" marker-end="url(#arrowAmber)"/>
    <path d="M800,347 L825,347 L825,252 L845,252" stroke="#b5690f" stroke-width="1.4" fill="none" marker-end="url(#arrowAmber)"/>

    <!-- ===== Human Review Gate ===== -->
    <rect x="850" y="142" width="210" height="230" rx="3" fill="#faead4" stroke="#b5690f" stroke-width="2"/>
    <g stroke="#b5690f" stroke-width="2">
      <line x1="878" y1="164" x2="878" y2="184"/>
      <line x1="892" y1="164" x2="892" y2="184"/>
      <line x1="906" y1="164" x2="906" y2="184"/>
    </g>
    <text x="920" y="179" font-size="10" fill="#b5690f">GATE</text>
    <text x="878" y="210" font-size="14" font-weight="700" fill="#b5690f">Human Review</text>
    <line x1="878" y1="222" x2="1040" y2="222" stroke="#d99a4e"/>
    <text x="878" y="244" font-size="11.5" fill="#5b6472" font-family="Georgia, serif">QA engineer reads every draft</text>
    <text x="878" y="264" font-size="11" fill="#5b6472" font-family="Georgia, serif">maps CSV rows → BDD scenarios</text>
    <text x="878" y="281" font-size="11" fill="#5b6472" font-family="Georgia, serif">via <tspan font-family="ui-monospace, monospace">@TC-XXX</tspan> tags</text>
    <text x="878" y="308" font-size="11" fill="#5b6472" font-family="Georgia, serif" font-style="italic">nothing below this line runs</text>
    <text x="878" y="323" font-size="11" fill="#5b6472" font-family="Georgia, serif" font-style="italic">until a human signs off</text>

    <!-- elbow connector: gate -> row 2 -->
    <path d="M955,372 L955,432 L170,432 L170,470" stroke="#aab2bd" stroke-width="1.4" fill="none" marker-end="url(#arrowInk)"/>
    <text x="500" y="425" font-size="10.5" fill="#8992a0">approved, hand-written step defs added</text>

    <!-- ===== Row 2: trusted / executable ===== -->
    <g>
      <rect x="40" y="472" width="255" height="105" rx="3" fill="#ffffff" stroke="#aab2bd" stroke-width="1.4"/>
      <text x="56" y="496" font-size="10" fill="#8992a0">playwright-project/</text>
      <text x="56" y="516" font-size="13.5" font-weight="700">BDD Suite</text>
      <text x="56" y="533" font-size="11" fill="#5b6472" font-family="Georgia, serif">features/*.feature</text>
      <text x="56" y="549" font-size="11" fill="#5b6472" font-family="Georgia, serif">steps/*.ts (playwright-bdd)</text>
    </g>
    <path d="M295,524 L322,524" stroke="#aab2bd" stroke-width="1.4" fill="none" marker-end="url(#arrowInk)"/>

    <g>
      <rect x="325" y="472" width="230" height="105" rx="3" fill="#ffffff" stroke="#aab2bd" stroke-width="1.4"/>
      <text x="341" y="496" font-size="10" fill="#8992a0">EXECUTE</text>
      <text x="341" y="516" font-size="13.5" font-weight="700">Test Run</text>
      <text x="341" y="533" font-size="11" fill="#5b6472" font-family="Georgia, serif">npm run test:smoke</text>
      <text x="341" y="549" font-size="11" fill="#5b6472" font-family="Georgia, serif">/ test:regression</text>
    </g>
    <path d="M555,524 L582,524" stroke="#aab2bd" stroke-width="1.4" fill="none" marker-end="url(#arrowInk)"/>

    <g>
      <rect x="585" y="472" width="255" height="105" rx="3" fill="#ffffff" stroke="#aab2bd" stroke-width="1.4"/>
      <text x="601" y="496" font-size="10" fill="#8992a0">REPORT</text>
      <text x="601" y="516" font-size="13.5" font-weight="700">Reports</text>
      <text x="601" y="533" font-size="11" fill="#5b6472" font-family="Georgia, serif">Playwright HTML</text>
      <text x="601" y="549" font-size="11" fill="#5b6472" font-family="Georgia, serif">Allure suite + history</text>
    </g>
    <path d="M840,524 L867,524" stroke="#aab2bd" stroke-width="1.4" fill="none" marker-end="url(#arrowInk)"/>

    <g>
      <rect x="870" y="472" width="250" height="105" rx="3" fill="#ffffff" stroke="#aab2bd" stroke-width="1.4"/>
      <text x="886" y="496" font-size="10" fill="#8992a0">PUBLISH</text>
      <text x="886" y="516" font-size="13.5" font-weight="700">GitHub Pages</text>
      <text x="886" y="533" font-size="11" fill="#5b6472" font-family="Georgia, serif">on every push to main</text>
      <text x="886" y="549" font-size="11" fill="#5b6472" font-family="Georgia, serif">no artifact download needed</text>
    </g>

  </g>

  <!-- ===== Footer ===== -->
  <line x1="48" y1="710" x2="1272" y2="710" stroke="#d7dce2"/>
  <g font-family="Georgia, serif" text-anchor="middle">
    <text x="660" y="750" font-size="23" font-style="italic" font-weight="700" fill="#161b22">"Not an autonomous agent."</text>
    <text x="660" y="778" font-size="14" fill="#5b6472">Deliberate, single-shot LLM calls — always reviewed by a human before anything becomes a test.</text>
  </g>
</svg>
